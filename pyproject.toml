[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "display-logger"
version = "0.1.0"
description = "Leitura de displays por webcam com perfis, log JSONL e exportação CSV"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "opencv-python>=4.6,<5"]

[project.optional-dependencies]
yolo = ["ultralytics>=8.4,<9", "numpy>=1.24,<2", "opencv-python>=4.7,<4.12"]

[project.scripts]
display-logger = "display_logger.cli:main"

[tool.setuptools.packages.find]
include = ["display_logger*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
